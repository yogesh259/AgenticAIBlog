<figure class="card demo sd cg" aria-labelledby="cg-title">
  <div class="demo-head">
    <h3 id="cg-title">A chain and a graph</h3>
    <p>The same kind of question, answered by a one-way chain and by a graph whose nodes share one state and can loop.</p>
  </div>

  <div class="cg-panels">
    <div class="sd-stage">
      <svg viewBox="0 0 300 336" role="img" aria-labelledby="cg-a-title cg-a-desc">
        <title id="cg-a-title">A chain</title>
        <desc id="cg-a-desc">A question flows through a prompt, a model and a parser, one arrow each, and comes out as an answer. Each step runs once, in order.</desc>
        <defs>
          <marker id="cg-arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
        </defs>
        <text class="sd-label" x="20" y="30">A chain (LCEL)</text>

        <g class="sd-cls"><rect class="box" x="90" y="48" width="120" height="30" rx="15"/><text class="sd-t" x="150" y="68" text-anchor="middle">question</text></g>
        <g class="sd-cls"><rect class="box" x="80" y="102" width="140" height="40" rx="10"/><text class="sd-t" x="150" y="127" text-anchor="middle">prompt</text></g>
        <g class="sd-model"><rect class="box" x="80" y="166" width="140" height="40" rx="10"/><text class="sd-t" x="150" y="191" text-anchor="middle">model</text></g>
        <g class="sd-cls"><rect class="box" x="80" y="230" width="140" height="40" rx="10"/><text class="sd-t" x="150" y="255" text-anchor="middle">parser</text></g>
        <g class="sd-answer"><rect class="box" x="90" y="294" width="120" height="30" rx="15"/><text x="150" y="314" text-anchor="middle">answer</text></g>

        <path class="sd-arrow" d="M150 78 V98" marker-end="url(#cg-arrow-a)"/>
        <path class="sd-arrow" d="M150 142 V162" marker-end="url(#cg-arrow-a)"/>
        <path class="sd-arrow" d="M150 206 V226" marker-end="url(#cg-arrow-a)"/>
        <path class="sd-arrow" d="M150 270 V290" marker-end="url(#cg-arrow-a)"/>
        <text class="sd-small" x="230" y="182">each step</text>
        <text class="sd-small" x="230" y="197">runs once,</text>
        <text class="sd-small" x="230" y="212">in order</text>
      </svg>
    </div>

    <div class="sd-stage">
      <svg viewBox="0 0 300 336" role="img" aria-labelledby="cg-b-title cg-b-desc">
        <title id="cg-b-title">A graph</title>
        <desc id="cg-b-desc">START leads to a chatbot node that calls the model. A dotted edge leads from the chatbot to a weather tool node, whose edge leads back to the chatbot: a loop. Another dotted edge leads from the chatbot to END once it can answer. A state card holds the messages that every node reads and updates.</desc>
        <defs>
          <marker id="cg-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
        </defs>
        <text class="sd-label" x="20" y="30">A graph (LangGraph)</text>

        <g class="sd-obj">
          <rect class="box" x="168" y="44" width="116" height="62" rx="10"/>
          <text class="sd-t" x="180" y="64">state</text>
          <line class="rule" x1="168" y1="74" x2="284" y2="74"/>
          <text x="180" y="94">messages</text>
        </g>
        <path class="sd-divider" d="M168 98 L142 124"/>
        <path class="sd-divider" d="M262 106 V182"/>

        <g class="sd-cls"><rect class="box" x="30" y="56" width="96" height="28" rx="14"/><text class="sd-t" x="78" y="75" text-anchor="middle">START</text></g>
        <g class="sd-model">
          <rect class="box" x="18" y="122" width="120" height="48" rx="10"/>
          <text class="sd-t" x="78" y="143" text-anchor="middle">chatbot</text>
          <text class="sd-small" x="78" y="160" text-anchor="middle">the model decides</text>
        </g>
        <g class="sd-tool">
          <rect class="box" x="168" y="186" width="116" height="48" rx="10"/>
          <text class="sd-t" x="226" y="207" text-anchor="middle">weather</text>
          <text class="sd-small" x="226" y="224" text-anchor="middle">a tool</text>
        </g>
        <g class="sd-cls"><rect class="box" x="30" y="290" width="96" height="28" rx="14"/><text class="sd-t" x="78" y="309" text-anchor="middle">END</text></g>

        <path class="sd-arrow" d="M78 84 V118" marker-end="url(#cg-arrow-b)"/>
        <path class="sd-arrow sd-arrow--dash" d="M138 136 C178 136 204 150 210 182" marker-end="url(#cg-arrow-b)"/>
        <text class="sd-small" x="160" y="128">needs data</text>
        <path class="sd-arrow" d="M168 222 C126 222 104 206 102 174" marker-end="url(#cg-arrow-b)"/>
        <text class="sd-small" x="130" y="246">result goes back</text>
        <path class="sd-arrow sd-arrow--dash" d="M56 170 V286" marker-end="url(#cg-arrow-b)"/>
        <text class="sd-small" x="62" y="270">can answer</text>
      </svg>
    </div>
  </div>

  <ol class="sd-keys">
    <li><b>A chain</b> runs each step once, in the order it was written. Data flows one way, so no step can run again: a directed acyclic graph, a DAG.</li>
    <li><b>A graph</b> keeps one state that every node reads and updates. A dotted edge is chosen by a function at run time: here the model decides whether it needs the weather, and the tool's edge leads back to it. That cycle is the agent loop.</li>
    <li><b>The way out:</b> the dotted edge to END, taken once the model can answer, plus a step limit for a run that never takes it.</li>
  </ol>
  <p class="observe"><b>Observe:</b> the chain's path is fixed when you write it; the graph's path is chosen while it runs, one step at a time.</p>
</figure>
