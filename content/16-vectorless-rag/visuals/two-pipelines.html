<figure class="card demo sd tp" aria-labelledby="tp-title">
  <div class="demo-head">
    <h3 id="tp-title">Two ways to retrieve</h3>
    <p>The same long document and question, through vector RAG and through vectorless RAG. Each row is the same stage in both.</p>
  </div>

  <div class="tp-panels">
    <div class="sd-stage">
      <svg viewBox="0 0 340 484" role="img" aria-labelledby="tp-a-title tp-a-desc">
        <title id="tp-a-title">Vector RAG</title>
        <desc id="tp-a-desc">A PDF is split into fixed-size chunks and each chunk is embedded. The vectors go into a vector store such as FAISS, Chroma or Pinecone. For a question, the question is embedded and a nearest-neighbour search takes the k closest chunks. The result is k chunks with no headings and no pages, and the model writes an answer from them.</desc>
        <defs>
          <marker id="tp-arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
        </defs>
        <text class="sd-t" x="86" y="22">Vector RAG</text>

        <text class="sd-label" x="10" y="66">document</text>
        <text class="sd-label" x="10" y="141">index</text>
        <text class="sd-label" x="10" y="219">store</text>
        <text class="sd-label" x="10" y="301">retrieve</text>
        <text class="sd-label" x="10" y="383">result</text>
        <text class="sd-label" x="10" y="456">answer</text>

        <g class="sd-obj">
          <rect class="box" x="86" y="40" width="242" height="44" rx="10"/>
          <text class="sd-t" x="207" y="59" text-anchor="middle">PDF document</text>
          <text class="sd-small" x="207" y="75" text-anchor="middle">a long report or paper</text>
        </g>
        <g class="sd-model">
          <rect class="box" x="86" y="112" width="242" height="50" rx="10"/>
          <text class="sd-t" x="207" y="133" text-anchor="middle">split, then embed</text>
          <text class="sd-small" x="207" y="150" text-anchor="middle">fixed-size chunks, a vector each</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="190" width="242" height="50" rx="10"/>
          <text class="sd-t" x="207" y="211" text-anchor="middle">vector store</text>
          <text class="sd-small" x="207" y="228" text-anchor="middle">FAISS, Chroma, Pinecone</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="276" width="68" height="40" rx="10"/>
          <text class="sd-t" x="120" y="300" text-anchor="middle">question</text>
        </g>
        <g class="sd-cls">
          <rect class="box" x="166" y="268" width="162" height="64" rx="10"/>
          <text class="sd-t" x="247" y="290" text-anchor="middle">nearest neighbours</text>
          <text class="sd-small" x="247" y="307" text-anchor="middle">embeds the question,</text>
          <text class="sd-small" x="247" y="322" text-anchor="middle">takes the k closest</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="360" width="242" height="44" rx="10"/>
          <text class="sd-t" x="207" y="379" text-anchor="middle">k chunks</text>
          <text class="sd-small" x="207" y="395" text-anchor="middle">no headings, no pages</text>
        </g>
        <g class="sd-answer">
          <rect class="box" x="86" y="434" width="242" height="38" rx="19"/>
          <text x="207" y="457" text-anchor="middle">answer</text>
        </g>

        <path class="sd-arrow" d="M207 84 V108" marker-end="url(#tp-arrow-a)"/>
        <path class="sd-arrow" d="M207 162 V186" marker-end="url(#tp-arrow-a)"/>
        <path class="sd-arrow" d="M247 240 V264" marker-end="url(#tp-arrow-a)"/>
        <path class="sd-arrow" d="M154 296 H162" marker-end="url(#tp-arrow-a)"/>
        <path class="sd-arrow" d="M247 332 V356" marker-end="url(#tp-arrow-a)"/>
        <path class="sd-arrow" d="M207 404 V430" marker-end="url(#tp-arrow-a)"/>
      </svg>
    </div>

    <div class="sd-stage">
      <svg viewBox="0 0 340 484" role="img" aria-labelledby="tp-b-title tp-b-desc">
        <title id="tp-b-title">Vectorless RAG</title>
        <desc id="tp-b-desc">The same PDF becomes a tree of its sections, with a summary of each, stored as one JSON file of titles, pages and summaries. For a question, a model reads the tree and picks node IDs: a tree search. The result is named sections with titles and page numbers, and the model writes an answer that cites them.</desc>
        <defs>
          <marker id="tp-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
        </defs>
        <text class="sd-t" x="86" y="22">Vectorless RAG</text>

        <text class="sd-label" x="10" y="66">document</text>
        <text class="sd-label" x="10" y="141">index</text>
        <text class="sd-label" x="10" y="219">store</text>
        <text class="sd-label" x="10" y="301">retrieve</text>
        <text class="sd-label" x="10" y="383">result</text>
        <text class="sd-label" x="10" y="456">answer</text>

        <g class="sd-obj">
          <rect class="box" x="86" y="40" width="242" height="44" rx="10"/>
          <text class="sd-t" x="207" y="59" text-anchor="middle">PDF document</text>
          <text class="sd-small" x="207" y="75" text-anchor="middle">a long report or paper</text>
        </g>
        <g class="sd-model">
          <rect class="box" x="86" y="112" width="242" height="50" rx="10"/>
          <text class="sd-t" x="207" y="133" text-anchor="middle">build the tree</text>
          <text class="sd-small" x="207" y="150" text-anchor="middle">sections and a summary of each</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="190" width="242" height="50" rx="10"/>
          <text class="sd-t" x="207" y="211" text-anchor="middle">JSON tree</text>
          <text class="sd-small" x="207" y="228" text-anchor="middle">titles, pages, summaries</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="276" width="68" height="40" rx="10"/>
          <text class="sd-t" x="120" y="300" text-anchor="middle">question</text>
        </g>
        <g class="sd-model">
          <rect class="box" x="166" y="268" width="162" height="64" rx="10"/>
          <text class="sd-t" x="247" y="290" text-anchor="middle">tree search</text>
          <text class="sd-small" x="247" y="307" text-anchor="middle">a model reads the tree,</text>
          <text class="sd-small" x="247" y="322" text-anchor="middle">picks node IDs</text>
        </g>
        <g class="sd-obj">
          <rect class="box" x="86" y="360" width="242" height="44" rx="10"/>
          <text class="sd-t" x="207" y="379" text-anchor="middle">named sections</text>
          <text class="sd-small" x="207" y="395" text-anchor="middle">titles and page numbers</text>
        </g>
        <g class="sd-answer">
          <rect class="box" x="86" y="434" width="242" height="38" rx="19"/>
          <text x="207" y="457" text-anchor="middle">answer with citations</text>
        </g>

        <path class="sd-arrow" d="M207 84 V108" marker-end="url(#tp-arrow-b)"/>
        <path class="sd-arrow" d="M207 162 V186" marker-end="url(#tp-arrow-b)"/>
        <path class="sd-arrow" d="M247 240 V264" marker-end="url(#tp-arrow-b)"/>
        <path class="sd-arrow" d="M154 296 H162" marker-end="url(#tp-arrow-b)"/>
        <path class="sd-arrow" d="M247 332 V356" marker-end="url(#tp-arrow-b)"/>
        <path class="sd-arrow" d="M207 404 V430" marker-end="url(#tp-arrow-b)"/>
      </svg>
    </div>
  </div>

  <ol class="sd-keys">
    <li><b>Index,</b> once per document: vector RAG cuts the text into chunks of a fixed size and embeds each one; vectorless RAG builds a tree of the document's own sections and summarises each.</li>
    <li><b>Store:</b> the vectors go into a vector database; the tree is one JSON file.</li>
    <li><b>Retrieve,</b> for each question: vector RAG embeds the question and takes the k nearest chunks; vectorless RAG gives the question and the tree to a model, which reasons its way to the sections that answer it.</li>
    <li><b>Result:</b> anonymous chunks, or named sections whose titles and pages the answer can cite.</li>
  </ol>
  <p class="observe"><b>Observe:</b> on the left, retrieval is arithmetic on vectors and takes milliseconds; on the right, it is a model call that reads the tree. That call is where both the gain on long structured documents and the extra seconds per question come from.</p>
</figure>
