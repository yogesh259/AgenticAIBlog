<figure class="card demo sd" aria-labelledby="lp-title">
  <div class="demo-head">
    <h3 id="lp-title">Labels and positions</h3>
    <p>Every row has a label, the index, and a position, counted from 0. <code>loc</code> uses the label, <code>iloc</code> the position.</p>
  </div>

  <div class="sd-stage">
    <svg viewBox="0 0 640 262" role="img" aria-labelledby="lp-svg-title lp-svg-desc">
      <title id="lp-svg-title">The DataFrame before and after dropping row 0</title>
      <desc id="lp-svg-desc">Before: rows Alice, John and Jack with labels 0, 1, 2 and positions 0, 1, 2; the Name column is outlined as a Series. After drop(0): John has label 1 and position 0, Jack has label 2 and position 1. df.loc[1] finds John by his label; df.iloc[1] finds Jack by his position; df.loc[0] raises KeyError: 0.</desc>

      <!-- before -->
      <text class="sd-t" x="16" y="30">df</text>
      <text class="sd-small" x="38" y="30">before drop(0)</text>
      <text class="sd-small" x="31" y="66" text-anchor="middle">iloc</text>
      <text class="sd-small" x="61" y="66" text-anchor="middle">loc</text>
      <text class="sd-t" x="88" y="66">Name</text>
      <text class="sd-t" x="146" y="66">Age</text>
      <text class="sd-t" x="182" y="66">City</text>
      <g class="sd-obj">
        <rect class="box" x="78" y="76" width="178" height="78" rx="8"/>
        <line class="rule" x1="78" y1="102" x2="256" y2="102"/>
        <line class="rule" x1="78" y1="128" x2="256" y2="128"/>
        <text x="88" y="94">Alice</text><text x="146" y="94">26</text><text x="182" y="94">Bangalore</text>
        <text x="88" y="120">John</text><text x="146" y="120">31</text><text x="182" y="120">New York</text>
        <text x="88" y="146">Jack</text><text x="146" y="146">46</text><text x="182" y="146">Florida</text>
      </g>
      <text class="sd-small" x="31" y="94" text-anchor="middle">0</text>
      <text class="sd-t" x="61" y="94" text-anchor="middle">0</text>
      <text class="sd-small" x="31" y="120" text-anchor="middle">1</text>
      <text class="sd-t" x="61" y="120" text-anchor="middle">1</text>
      <text class="sd-small" x="31" y="146" text-anchor="middle">2</text>
      <text class="sd-t" x="61" y="146" text-anchor="middle">2</text>
      <rect class="sd-group" x="82" y="54" width="54" height="104" rx="7"/>
      <text class="sd-small" x="82" y="178">df['Name'] is one column:</text>
      <text class="sd-small" x="82" y="194">a Series with the same labels</text>

      <line class="sd-divider" x1="282" y1="20" x2="282" y2="246"/>

      <!-- after -->
      <text class="sd-t" x="300" y="30">df</text>
      <text class="sd-small" x="322" y="30">after drop(0)</text>
      <text class="sd-small" x="315" y="66" text-anchor="middle">iloc</text>
      <text class="sd-small" x="345" y="66" text-anchor="middle">loc</text>
      <text class="sd-t" x="372" y="66">Name</text>
      <text class="sd-t" x="430" y="66">Age</text>
      <text class="sd-t" x="466" y="66">City</text>
      <g class="sd-obj">
        <rect class="box" x="362" y="76" width="178" height="52" rx="8"/>
        <line class="rule" x1="362" y1="102" x2="540" y2="102"/>
        <text x="372" y="94">John</text><text x="430" y="94">31</text><text x="466" y="94">New York</text>
        <text x="372" y="120">Jack</text><text x="430" y="120">46</text><text x="466" y="120">Florida</text>
      </g>
      <text class="sd-small" x="315" y="94" text-anchor="middle">0</text>
      <g class="sd-badge"><circle cx="345" cy="90" r="10"/><text x="345" y="94" text-anchor="middle">1</text></g>
      <g class="sd-badge"><circle cx="315" cy="116" r="10"/><text x="315" y="120" text-anchor="middle">1</text></g>
      <text class="sd-t" x="345" y="120" text-anchor="middle">2</text>

      <g class="sd-name"><rect x="550" y="78" width="76" height="24" rx="12"/><text x="588" y="94" text-anchor="middle">loc[1]</text></g>
      <g class="sd-name"><rect x="550" y="104" width="76" height="24" rx="12"/><text x="588" y="120" text-anchor="middle">iloc[1]</text></g>
      <text class="sd-small" x="362" y="152">df.loc[1]: the row labelled 1, John</text>
      <text class="sd-small" x="362" y="170">df.iloc[1]: the row at position 1, Jack</text>

      <g class="sd-alert"><rect x="362" y="196" width="196" height="30" rx="8"/><text x="376" y="216">df.loc[0] → KeyError: 0</text></g>
    </svg>
  </div>

  <ol class="sd-keys">
    <li>A label stays with its row when rows are dropped, sorted or filtered; positions always run 0, 1, 2…</li>
    <li>After <code>drop(0)</code>, label 1 sits at position 0, so <code>loc[1]</code> and <code>iloc[1]</code> pick different rows.</li>
    <li>No row is labelled 0 any more: <code>df.loc[0]</code> raises <code>KeyError: 0</code>, while <code>df.iloc[0]</code> is John.</li>
  </ol>
  <p class="observe"><b>Observe:</b> use <code>loc</code> when you mean a row's name and <code>iloc</code> when you mean "the first", "the last" (<code>iloc[-1]</code>). <code>df.reset_index(drop=True)</code> numbers the labels from 0 again.</p>
</figure>
