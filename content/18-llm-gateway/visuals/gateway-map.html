<figure class="card demo sd gm" aria-labelledby="gm-title">
  <div class="demo-head">
    <h3 id="gm-title">Without and with a gateway</h3>
    <p>Three applications and four providers, wired directly and through one gateway that applies the same steps to every call.</p>
  </div>

  <div class="gm-panels">
    <div class="sd-stage">
      <svg viewBox="0 0 300 340" role="img" aria-labelledby="gm-a-title gm-a-desc">
        <title id="gm-a-title">Without a gateway</title>
        <desc id="gm-a-desc">Three applications, a chatbot, a RAG app and an agent, each connect directly to four providers, OpenAI, Claude, Gemini and Groq: twelve connections, each with its own key, SDK and error handling.</desc>
        <text class="sd-label" x="14" y="22">Without a gateway</text>

        <g class="sd-cls">
          <rect class="box" x="14" y="34" width="80" height="28" rx="8"/><text x="54" y="52" text-anchor="middle">chatbot</text>
          <rect class="box" x="110" y="34" width="80" height="28" rx="8"/><text x="150" y="52" text-anchor="middle">RAG app</text>
          <rect class="box" x="206" y="34" width="80" height="28" rx="8"/><text x="246" y="52" text-anchor="middle">agent</text>
        </g>

        <g class="gm-wires">
          <path class="sd-arrow" d="M54 62 L39 268"/><path class="sd-arrow" d="M54 62 L113 268"/>
          <path class="sd-arrow" d="M54 62 L187 268"/><path class="sd-arrow" d="M54 62 L261 268"/>
          <path class="sd-arrow" d="M150 62 L39 268"/><path class="sd-arrow" d="M150 62 L113 268"/>
          <path class="sd-arrow" d="M150 62 L187 268"/><path class="sd-arrow" d="M150 62 L261 268"/>
          <path class="sd-arrow" d="M246 62 L39 268"/><path class="sd-arrow" d="M246 62 L113 268"/>
          <path class="sd-arrow" d="M246 62 L187 268"/><path class="sd-arrow" d="M246 62 L261 268"/>
        </g>

        <g class="gm-note">
          <rect x="70" y="146" width="160" height="44" rx="8"/>
          <text class="sd-small" x="150" y="164" text-anchor="middle">in every app: each provider's</text>
          <text class="sd-small" x="150" y="180" text-anchor="middle">key, SDK, errors and limits</text>
        </g>

        <g class="sd-model">
          <rect class="box" x="8" y="268" width="62" height="28" rx="8"/><text x="39" y="286" text-anchor="middle">OpenAI</text>
          <rect class="box" x="82" y="268" width="62" height="28" rx="8"/><text x="113" y="286" text-anchor="middle">Claude</text>
          <rect class="box" x="156" y="268" width="62" height="28" rx="8"/><text x="187" y="286" text-anchor="middle">Gemini</text>
          <rect class="box" x="230" y="268" width="62" height="28" rx="8"/><text x="261" y="286" text-anchor="middle">Groq</text>
        </g>
        <text class="sd-small" x="150" y="324" text-anchor="middle">3 apps × 4 providers = 12 integrations</text>
      </svg>
    </div>

    <div class="sd-stage">
      <svg viewBox="0 0 300 340" role="img" aria-labelledby="gm-b-title gm-b-desc">
        <title id="gm-b-title">With a gateway</title>
        <desc id="gm-b-desc">The three applications send every request in one format to an LLM gateway. Inside it, six steps in order: keys and limits, input checks, the cache, picking a model, retries and fallbacks, and logging with prices. The gateway then calls one of the four providers in that provider's own format.</desc>
        <defs>
          <marker id="gm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
        </defs>
        <text class="sd-label" x="14" y="22">With a gateway</text>

        <g class="sd-cls">
          <rect class="box" x="14" y="34" width="80" height="28" rx="8"/><text x="54" y="52" text-anchor="middle">chatbot</text>
          <rect class="box" x="110" y="34" width="80" height="28" rx="8"/><text x="150" y="52" text-anchor="middle">RAG app</text>
          <rect class="box" x="206" y="34" width="80" height="28" rx="8"/><text x="246" y="52" text-anchor="middle">agent</text>
        </g>
        <path class="sd-arrow" d="M54 62 V94" marker-end="url(#gm-arrow)"/>
        <path class="sd-arrow" d="M150 62 V94" marker-end="url(#gm-arrow)"/>
        <path class="sd-arrow" d="M246 62 V94" marker-end="url(#gm-arrow)"/>
        <text class="sd-small" x="102" y="84" text-anchor="middle">one API</text>
        <text class="sd-small" x="198" y="84" text-anchor="middle">one API</text>

        <g class="sd-cls gm-gate">
          <rect class="box" x="10" y="98" width="280" height="140" rx="12"/>
          <text class="sd-t" x="24" y="118">LLM gateway</text>
          <text class="sd-small" x="276" y="118" text-anchor="end">every call, in order</text>
        </g>
        <g class="gm-step sd-cls"><rect class="box" x="20" y="128" width="128" height="26" rx="6"/><text x="30" y="145">1 · keys, limits</text></g>
        <g class="gm-step sd-alert"><rect x="20" y="160" width="128" height="26" rx="6"/><text x="30" y="177">2 · check input</text></g>
        <g class="gm-step sd-obj"><rect class="box" x="20" y="192" width="128" height="26" rx="6"/><text x="30" y="209">3 · cache</text></g>
        <g class="gm-step sd-cls"><rect class="box" x="152" y="128" width="128" height="26" rx="6"/><text x="162" y="145">4 · pick a model</text></g>
        <g class="gm-step sd-cls"><rect class="box" x="152" y="160" width="128" height="26" rx="6"/><text x="162" y="177">5 · retry, fall back</text></g>
        <g class="gm-step sd-obj"><rect class="box" x="152" y="192" width="128" height="26" rx="6"/><text x="162" y="209">6 · log, price</text></g>

        <path class="sd-arrow" d="M39 238 V264" marker-end="url(#gm-arrow)"/>
        <path class="sd-arrow" d="M113 238 V264" marker-end="url(#gm-arrow)"/>
        <path class="sd-arrow" d="M187 238 V264" marker-end="url(#gm-arrow)"/>
        <path class="sd-arrow" d="M261 238 V264" marker-end="url(#gm-arrow)"/>

        <g class="sd-model">
          <rect class="box" x="8" y="268" width="62" height="28" rx="8"/><text x="39" y="286" text-anchor="middle">OpenAI</text>
          <rect class="box" x="82" y="268" width="62" height="28" rx="8"/><text x="113" y="286" text-anchor="middle">Claude</text>
          <rect class="box" x="156" y="268" width="62" height="28" rx="8"/><text x="187" y="286" text-anchor="middle">Gemini</text>
          <rect class="box" x="230" y="268" width="62" height="28" rx="8"/><text x="261" y="286" text-anchor="middle">Groq</text>
        </g>
        <text class="sd-small" x="150" y="324" text-anchor="middle">3 + 4 connections, one set of rules</text>
      </svg>
    </div>
  </div>

  <ol class="sd-keys">
    <li><b>Without a gateway</b> each application integrates each provider: its key, its SDK, its errors and limits, twelve times over, and switching a model means editing every app.</li>
    <li><b>With a gateway</b> applications speak one API to one place. The gateway does the provider-specific work and applies the same steps to every call, in the order shown.</li>
    <li><b>The order matters:</b> a blocked input never reaches a provider, and a cache hit skips steps 4 and 5, so it costs nothing.</li>
  </ol>
  <p class="observe"><b>Observe:</b> every step the gateway adds sits on the path of every call, so the gateway has to be fast and must not fail.</p>
</figure>
