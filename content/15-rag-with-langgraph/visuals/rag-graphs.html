<figure class="card demo sd rg" aria-labelledby="rg-title">
  <div class="demo-head">
    <h3 id="rg-title">Three RAG graphs</h3>
    <p>Each pattern drawn as the graph its lesson builds. Dashed edges are chosen at run time; a blue label means a model made the choice.</p>
  </div>

  <div class="sd-stage rg-stage">
    <svg viewBox="0 0 300 396" role="img" aria-labelledby="rg-a-title rg-a-desc">
      <title id="rg-a-title">Agentic RAG</title>
      <desc id="rg-a-desc">START leads to agent, a model call. If the model asks for a tool, retrieve runs one of two retriever tools; if not, the run ends. After retrieve, a model grades the results: relevant leads to generate and then END, not relevant leads to rewrite, which goes back to agent.</desc>
      <defs>
        <marker id="rg-arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
      </defs>
      <rect class="rg-panel" x="6" y="6" width="288" height="384" rx="14"/>
      <text class="sd-label" x="22" y="30">Agentic RAG · 15.2</text>
      <text class="sd-small" x="22" y="48">a model with two retriever tools</text>

      <g class="sd-cls"><rect class="box" x="90" y="60" width="60" height="24" rx="12"/><text x="120" y="77" text-anchor="middle">START</text></g>
      <g class="sd-model"><rect class="box" x="60" y="100" width="120" height="34" rx="9"/><text class="sd-t" x="120" y="122" text-anchor="middle">agent</text></g>
      <g class="sd-answer"><rect class="box" x="214" y="105" width="60" height="24" rx="12"/><text x="244" y="122" text-anchor="middle">END</text></g>
      <g class="sd-tool"><rect class="box" x="60" y="160" width="120" height="34" rx="9"/><text class="sd-t" x="120" y="182" text-anchor="middle">retrieve</text></g>
      <g class="sd-model"><rect class="box" x="20" y="240" width="104" height="34" rx="9"/><text class="sd-t" x="72" y="262" text-anchor="middle">generate</text></g>
      <g class="sd-model"><rect class="box" x="166" y="240" width="104" height="34" rx="9"/><text class="sd-t" x="218" y="262" text-anchor="middle">rewrite</text></g>
      <g class="sd-answer"><rect class="box" x="42" y="296" width="60" height="24" rx="12"/><text x="72" y="313" text-anchor="middle">END</text></g>

      <path class="sd-arrow" d="M120 84 V96" marker-end="url(#rg-arrow-a)"/>
      <path class="sd-arrow sd-arrow--dash" d="M180 117 H210" marker-end="url(#rg-arrow-a)"/>
      <text class="sd-small rg-m" x="244" y="99" text-anchor="middle">no tool call</text>
      <path class="sd-arrow sd-arrow--dash" d="M120 134 V156" marker-end="url(#rg-arrow-a)"/>
      <text class="sd-small rg-m" x="128" y="150">tool call</text>
      <path class="sd-arrow sd-arrow--dash" d="M100 194 C92 212 76 218 74 236" marker-end="url(#rg-arrow-a)"/>
      <text class="sd-small rg-m" x="82" y="214" text-anchor="end">relevant</text>
      <path class="sd-arrow sd-arrow--dash" d="M140 194 C150 212 212 216 216 236" marker-end="url(#rg-arrow-a)"/>
      <text class="sd-small rg-m" x="150" y="232" text-anchor="middle">not relevant</text>
      <path class="sd-arrow" d="M240 240 C240 186 206 150 183 136" marker-end="url(#rg-arrow-a)"/>
      <path class="sd-arrow" d="M72 274 V292" marker-end="url(#rg-arrow-a)"/>
      <text class="sd-small sd-hot" x="150" y="374" text-anchor="middle">rewrite back to agent: no limit</text>
    </svg>

    <svg viewBox="0 0 300 396" role="img" aria-labelledby="rg-b-title rg-b-desc">
      <title id="rg-b-title">Corrective RAG</title>
      <desc id="rg-b-desc">START leads to retrieve, then grade_documents, a model call per chunk. Code then decides: if all chunks passed, generate; if any failed, transform_query rewrites the question, web_search_node searches the web, and generate answers. Generate leads to END. There is no cycle.</desc>
      <defs>
        <marker id="rg-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
      </defs>
      <rect class="rg-panel" x="6" y="6" width="288" height="384" rx="14"/>
      <text class="sd-label" x="22" y="30">Corrective RAG · 15.3</text>
      <text class="sd-small" x="22" y="48">grade every chunk, fall back to the web</text>

      <g class="sd-cls"><rect class="box" x="120" y="60" width="60" height="24" rx="12"/><text x="150" y="77" text-anchor="middle">START</text></g>
      <g class="sd-tool"><rect class="box" x="90" y="100" width="120" height="34" rx="9"/><text class="sd-t" x="150" y="122" text-anchor="middle">retrieve</text></g>
      <g class="sd-model"><rect class="box" x="80" y="156" width="140" height="34" rx="9"/><text class="sd-t" x="150" y="178" text-anchor="middle">grade_documents</text></g>
      <g class="sd-model"><rect class="box" x="164" y="222" width="124" height="34" rx="9"/><text class="sd-t" x="226" y="244" text-anchor="middle">transform_query</text></g>
      <g class="sd-tool"><rect class="box" x="164" y="280" width="124" height="34" rx="9"/><text class="sd-t" x="226" y="302" text-anchor="middle">web_search_node</text></g>
      <g class="sd-model"><rect class="box" x="20" y="280" width="104" height="34" rx="9"/><text class="sd-t" x="72" y="302" text-anchor="middle">generate</text></g>
      <g class="sd-answer"><rect class="box" x="42" y="334" width="60" height="24" rx="12"/><text x="72" y="351" text-anchor="middle">END</text></g>

      <path class="sd-arrow" d="M150 84 V96" marker-end="url(#rg-arrow-b)"/>
      <path class="sd-arrow" d="M150 134 V152" marker-end="url(#rg-arrow-b)"/>
      <path class="sd-arrow sd-arrow--dash" d="M196 190 C210 200 224 204 226 218" marker-end="url(#rg-arrow-b)"/>
      <text class="sd-small" x="232" y="208">any failed</text>
      <path class="sd-arrow sd-arrow--dash" d="M104 190 C84 210 72 240 72 276" marker-end="url(#rg-arrow-b)"/>
      <text class="sd-small" x="84" y="240">all passed</text>
      <path class="sd-arrow" d="M226 256 V276" marker-end="url(#rg-arrow-b)"/>
      <path class="sd-arrow" d="M164 297 H128" marker-end="url(#rg-arrow-b)"/>
      <path class="sd-arrow" d="M72 314 V330" marker-end="url(#rg-arrow-b)"/>
      <text class="sd-small" x="150" y="374" text-anchor="middle">no cycle: every run ends</text>
    </svg>

    <svg viewBox="0 0 300 396" role="img" aria-labelledby="rg-c-title rg-c-desc">
      <title id="rg-c-title">Adaptive RAG</title>
      <desc id="rg-c-desc">A model routes the question from START: off-topic questions go to web_search, then generate; questions on the index's topics go to retrieve, then grade_documents. If chunks are left, generate; if none, transform_query rewrites the question and retrieve runs again. After generate, model graders decide: useful leads to END, not grounded runs generate again, not useful goes to transform_query.</desc>
      <defs>
        <marker id="rg-arrow-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9ca3af"/></marker>
      </defs>
      <rect class="rg-panel" x="6" y="6" width="288" height="384" rx="14"/>
      <text class="sd-label" x="22" y="30">Adaptive RAG · 15.4</text>
      <text class="sd-small" x="22" y="48">route first, check the answer after</text>

      <g class="sd-cls"><rect class="box" x="120" y="60" width="60" height="24" rx="12"/><text x="150" y="77" text-anchor="middle">START</text></g>
      <g class="sd-tool"><rect class="box" x="20" y="104" width="104" height="34" rx="9"/><text class="sd-t" x="72" y="126" text-anchor="middle">web_search</text></g>
      <g class="sd-tool"><rect class="box" x="176" y="104" width="104" height="34" rx="9"/><text class="sd-t" x="228" y="126" text-anchor="middle">retrieve</text></g>
      <g class="sd-model"><rect class="box" x="160" y="160" width="132" height="34" rx="9"/><text class="sd-t" x="226" y="182" text-anchor="middle">grade_documents</text></g>
      <g class="sd-model"><rect class="box" x="164" y="228" width="124" height="34" rx="9"/><text class="sd-t" x="226" y="250" text-anchor="middle">transform_query</text></g>
      <g class="sd-model"><rect class="box" x="20" y="228" width="104" height="34" rx="9"/><text class="sd-t" x="72" y="250" text-anchor="middle">generate</text></g>
      <g class="sd-answer"><rect class="box" x="42" y="330" width="60" height="24" rx="12"/><text x="72" y="347" text-anchor="middle">END</text></g>

      <path class="sd-arrow sd-arrow--dash" d="M132 84 C116 96 80 92 74 100" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small rg-m" x="96" y="84" text-anchor="end">web</text>
      <path class="sd-arrow sd-arrow--dash" d="M168 84 C184 96 222 92 226 100" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small rg-m" x="206" y="84">index</text>
      <path class="sd-arrow" d="M72 138 V224" marker-end="url(#rg-arrow-c)"/>
      <path class="sd-arrow" d="M228 138 V156" marker-end="url(#rg-arrow-c)"/>
      <path class="sd-arrow sd-arrow--dash" d="M226 194 V224" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small" x="234" y="214">none left</text>
      <path class="sd-arrow" d="M288 245 C297 245 297 121 284 121" marker-end="url(#rg-arrow-c)"/>
      <path class="sd-arrow sd-arrow--dash" d="M160 177 C134 177 118 200 116 224" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small" x="134" y="214">some left</text>
      <path class="sd-arrow sd-arrow--dash" d="M34 228 C34 194 58 194 58 224" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small rg-m" x="12" y="176">not</text>
      <text class="sd-small rg-m" x="12" y="191">grounded</text>
      <path class="sd-arrow sd-arrow--dash" d="M116 262 C120 290 206 290 210 266" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small rg-m" x="163" y="300" text-anchor="middle">not useful</text>
      <path class="sd-arrow sd-arrow--dash" d="M72 262 V326" marker-end="url(#rg-arrow-c)"/>
      <text class="sd-small rg-m" x="64" y="300" text-anchor="end">useful</text>
      <text class="sd-small sd-hot" x="150" y="374" text-anchor="middle">three cycles, none limited</text>
    </svg>
  </div>

  <div class="legend rg-legend">
    <span><i class="rg-dot rg-dot--model"></i>calls a model</span>
    <span><i class="rg-dot rg-dot--tool"></i>retrieves or searches</span>
    <span><i class="rg-dot rg-dot--out"></i>the run ends</span>
  </div>

  <ol class="sd-keys">
    <li><b>Agentic:</b> the model decides whether to search and which collection; one grade covers everything retrieved, and a rewrite hands the question back to the model.</li>
    <li><b>Corrective:</b> retrieval always runs and every chunk is graded; if any chunk fails, the question is rewritten for a web search whose results join the chunks that passed.</li>
    <li><b>Adaptive:</b> a router picks the source before anything runs; after the answer, two graders can send the run back to <code>generate</code> or to a rewrite.</li>
  </ol>
  <p class="observe"><b>Observe:</b> corrective RAG runs straight through, while agentic and adaptive RAG contain cycles that nothing counts. Each later lesson shows where its cycle can spin and how to give it an exit.</p>
</figure>
