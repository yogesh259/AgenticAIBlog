<figure class="card demo sd" aria-labelledby="nc-title">
  <div class="demo-head">
    <h3 id="nc-title">Nearest chunks and their scores</h3>
    <p>The question and the five chunks of <code>speech.txt</code> as points, with the scores FAISS returned.</p>
  </div>

  <div class="sd-stage">
    <svg viewBox="0 0 680 260" role="img" aria-labelledby="nc-svg-title nc-svg-desc">
      <title id="nc-svg-title">A similarity search as nearest points</title>
      <desc id="nc-svg-desc">A question point with five chunk points around it. A dashed circle holds the four nearest, numbered 1 to 4 with lines to the question; their scores are 15553, 15925, 16787 and 19336. The fifth chunk, outside the circle, is not returned.</desc>

      <!-- the k = 4 boundary -->
      <circle class="sd-arrow sd-arrow--dash" cx="190" cy="130" r="112"/>
      <text class="sd-small" x="190" y="12" text-anchor="middle">the 4 nearest</text>

      <!-- distances to the 4 nearest -->
      <line class="sd-arrow" x1="190" y1="130" x2="237" y2="97"/>
      <line class="sd-arrow" x1="190" y1="130" x2="125" y2="100"/>
      <line class="sd-arrow" x1="190" y1="130" x2="155" y2="208"/>
      <line class="sd-arrow" x1="190" y1="130" x2="294" y2="158"/>

      <!-- chunks -->
      <g class="sd-obj">
        <circle class="box" cx="237" cy="97" r="7"/>
        <circle class="box" cx="125" cy="100" r="7"/>
        <circle class="box" cx="155" cy="208" r="7"/>
        <circle class="box" cx="294" cy="158" r="7"/>
      </g>
      <g class="sd-obj sd-dim">
        <circle class="box" cx="45" cy="78" r="7"/>
      </g>
      <text class="sd-small" x="45" y="102" text-anchor="middle">not returned</text>

      <!-- the question -->
      <g class="sd-obj">
        <circle class="sd-ring" cx="190" cy="130" r="12"/>
        <circle class="box" cx="190" cy="130" r="8"/>
      </g>
      <text class="sd-t" x="190" y="160" text-anchor="middle">question</text>

      <!-- ranks -->
      <g class="sd-badge">
        <circle cx="252" cy="84" r="9"/><text x="252" y="88" text-anchor="middle">1</text>
        <circle cx="110" cy="87" r="9"/><text x="110" y="91" text-anchor="middle">2</text>
        <circle cx="140" cy="222" r="9"/><text x="140" y="226" text-anchor="middle">3</text>
        <circle cx="309" cy="171" r="9"/><text x="309" y="175" text-anchor="middle">4</text>
      </g>

      <!-- the scores -->
      <text class="sd-label" x="404" y="40">rank</text>
      <text class="sd-label" x="446" y="40">score</text>
      <text class="sd-label" x="510" y="40">chunk</text>
      <g class="sd-obj">
        <text x="412" y="68">1</text><text x="446" y="68">15553</text><text x="510" y="68">It is a distressing…</text>
        <text x="412" y="94">2</text><text x="446" y="94">15925</text><text x="510" y="94">To such a task…</text>
        <text x="412" y="120">3</text><text x="446" y="120">16787</text><text x="510" y="120">… It will be all…</text>
        <text x="412" y="146">4</text><text x="446" y="146">19336</text><text x="510" y="146">We have borne…</text>
      </g>
      <line class="sd-divider" x1="404" y1="162" x2="664" y2="162"/>
      <g class="sd-dim">
        <text x="412" y="184">-</text><text x="446" y="184">-</text><text x="510" y="184">The world must be…</text>
      </g>
      <text class="sd-small" x="404" y="222">score: squared distance to the question,</text>
      <text class="sd-small" x="404" y="240">lower is closer</text>
    </svg>
  </div>

  <ol class="sd-keys">
    <li>The question is embedded with the same model as the chunks, so all six are points in one space.</li>
    <li><code>similarity_search</code> returns the 4 nearest chunks, nearest first. The dashed circle is not a fixed radius: it is wherever the fourth chunk falls.</li>
    <li><code>similarity_search_with_score</code> adds each distance, squared. The fifth chunk is farther than the fourth, so it is not returned; <code>k=5</code> would include it.</li>
  </ol>
  <p class="observe"><b>Observe:</b> real vectors have thousands of numbers, not two, so the drawing shows the ranking, not the true distances. What carries over is the order: the nearest chunks are the ones whose meaning is closest to the question.</p>
</figure>
